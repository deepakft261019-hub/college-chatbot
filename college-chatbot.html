<!DOCTYPE html>
<html>
<head>
  <title>ABC College AI Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background-color: #343541;
      font-family: "Segoe UI", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 420px;
      height: 650px;
      background-color: #444654;
      border-radius: 12px;
      box-shadow: 0px 0px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background-color: #202123;
      color: white;
      padding: 18px;
      font-size: 18px;
      text-align: center;
      font-weight: 500;
      border-bottom: 1px solid #555;
    }

    .subheader {
      font-size: 13px;
      color: #ccc;
      margin-top: 4px;
    }

    .chat-area {
      flex: 1;
      background-color: #444654;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .footer {
      background-color: #202123;
      color: #aaa;
      text-align: center;
      padding: 10px;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">
    
    <div class="header">
      🎓 ABC College AI Assistant
      <div class="subheader">
        Powered by Dialogflow NLP
      </div>
    </div>

    <div class="chat-area">
      <iframe
        allow="microphone;"
        src="https://console.dialogflow.com/api-client/demo/embedded/0be73a13-3960-4099-8bf8-e4192d52855f">
      </iframe>
    </div>

    <div class="footer">
      24/7 Automated Admission Support
    </div>

  </div>

</body>
</html>
