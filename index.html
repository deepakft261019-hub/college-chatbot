<!DOCTYPE html>
<html>
<head>
  <title>ABC College AI Assistant</title>

    body {

      background-color: #343541;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 500px;
      height: 700px;
      background-color: #202123;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background-color: #202123;
      padding: 15px;
      text-align: center;
      color: white;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 1px solid #444654;
    }

    iframe {
      flex: 1;
      border: none;
    }

    .chat-footer {
      background-color: #202123;
      padding: 10px;
      text-align: center;
      color: #8e8ea0;
      font-size: 12px;
      border-top: 1px solid #444654;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      🎓 ABC College AI Assistant
    </div>

    <iframe 
      src="https://bot.dialogflow.com/0be73a13-3960-4099-8bf8-e4192d52855f">
    </iframe>

    <div class="chat-footer">
      Powered by Dialogflow NLP | 24/7 Admission Support
    </div>
  </div>

</body>
</html>
