<!DOCTYPE html>
<html>
<head>
  <title>ABC College AI Assistant</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: #343541;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 60px;
      background: #202123;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 1px solid #444;
    }

    .chat-area {
      flex: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .footer {
      height: 40px;
      background: #202123;
      color: #aaa;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      border-top: 1px solid #444;
    }
  </style>
</head>

<body>

  <div class="header">
    🎓 ABC College AI Assistant — Powered by Dialogflow
  </div>

  <div class="chat-area">
    <iframe 
      allow="microphone;" 
      src="https://bot.dialogflow.com/0be73a13-3960-4099-8bf8-e4192d52855f">
    </iframe>
  </div>

  <div class="footer">
    24/7 Automated Admission Support
  </div>

</body>
</html>
