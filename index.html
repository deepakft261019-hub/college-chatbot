<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABC College AI Assistant</title>

<style>
body {
    margin: 0;
    background-color: #0f172a;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Chat Container */
.chat-container {
    width: 420px;
    height: 720px;
    background: #111827;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    overflow: hidden;
}

/* Header */
.chat-header {
    background: #1f2937;
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid #374151;
}

.chat-header h2 {
    margin: 0;
    color: white;
    font-size: 18px;
}

.chat-header p {
    margin: 5px 0 0;
    color: #9ca3af;
    font-size: 13px;
}

/* Chat Area */
.chat-body {
    flex: 1;
    background: #f3f4f6;
}

/* Footer */
.chat-footer {
    background: #1f2937;
    text-align: center;
    padding: 12px;
    font-size: 12px;
    color: #9ca3af;
}
</style>

</head>
<body>

<div class="chat-container">

    <div class="chat-header">
        <h2>🎓 ABC College AI Assistant</h2>
        <p>Powered by Dialogflow NLP</p>
    </div>

    <div class="chat-body">
        <iframe 
            height="100%" 
            width="100%" 
            style="border:none;"
            src="https://bot.dialogflow.com/0be73a13-3960-4099-8bf8-e4192d52855f">
        </iframe>
    </div>

    <div class="chat-footer">
        24/7 Automated Admission Support
    </div>

</div>

</body>
</html>
