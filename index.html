<!DOCTYPE html>
<html>
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #343541;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            padding: 15px;
            background-color: #202123;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #444;
        }

        .chat-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        iframe {
            border: none;
            width: 100%;
            max-width: 800px;
            height: 85vh;
            border-radius: 12px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
        }

        .footer {
            padding: 10px;
            text-align: center;
            font-size: 12px;
            background-color: #202123;
            border-top: 1px solid #444;
        }
    </style>
</head>

<body>

    <div class="header">
        CampusCare AI – Student Support Chatbot
    </div>

    <div class="chat-container">
        <iframe src="https://bot.dialogflow.com/91fd89fa-aea0-426d-8c7f-008ec209febb">

    </div>

    <div class="footer">
        Powered by Google Dialogflow | Academic Project – Group 11
    </div>
