<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusCare AI</title>

<script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

.header {
    text-align: center;
    padding: 20px;
    font-size: 22px;
    font-weight: bold;
}

.chat-wrapper {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

df-messenger {
    --df-messenger-bot-message: #e5e7eb;
    --df-messenger-user-message: #2563eb;
    --df-messenger-button-titlebar-color: #2563eb;
    --df-messenger-chat-background-color: white;
    --df-messenger-font-color: black;

    width: 90%;
    max-width: 800px;
    height: 85vh;
}
</style>
</head>

<body>

<div class="header">
CampusCare AI – Student Support Chatbot
</div>

<div class="chat-wrapper">
    <df-messenger
        intent="WELCOME"
        chat-title="CampusCare AI"
        agent-id="91fd89fa-aea0-426d-8c7f-008ec209febb"
        language-code="en"
        expand="true">
    </df-messenger>
</div>

</body>
</html>
