<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ABC College AI Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background-color: #0f172a;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .desktop-chat {
      width: 900px;
      height: 700px;
      background: #111827;
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #1f2937;
      padding: 20px;
      text-align: center;
      color: white;
      font-size: 20px;
      border-bottom: 1px solid #374151;
    }

    .chat-body {
      flex: 1;
      background: #ffffff;
    }

    .chat-footer {
      background: #1f2937;
      text-align: center;
      padding: 12px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

<div class="desktop-chat">

  <div class="chat-header">
    🎓 ABC College AI Assistant — Powered by Dialogflow
  </div>

  <div class="chat-body">
    <iframe
      width="100%"
      height="100%"
      style="border:none;"
      src="https://bot.dialogflow.com/0be73a13-3960-4099-8bf8-e4192d52855f">
    </iframe>
  </div>

  <div class="chat-footer">
    24/7 Automated Admission Support
  </div>

</div>

</body>
</html>
